<!DOCTYPE html>
<html>
<head>
    <title>The Hunger Games: Li Family Edition!</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        background: #f7f2f5;
        color: #5a4a52;
        font-family: 'Playfair Display', serif;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
    }

    h1 {
        margin-bottom: 10px;
    }

button {
    font-size: 18px;
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background: #e6cfd8;
    color: #5a4a52;
    width: 50px;
    text-align: center;
}

    button:hover {
        background: #3a3a45;
        color: #f7f2f5;
    }

    #viewer {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-top: 40px;
    }

#eventText {
    font-size: 24px;
    max-width: 600px;
    width: 600px;
    height: 100px;

    display: flex;
    align-items: center;      /* vertical centering */
    justify-content: center;  /* horizontal centering */

    text-align: center;
    transition: opacity 0.3s;
}

    input {
        padding: 12px 16px;
        border-radius: 8px;
        border: 2px solid #e6cfd8;
        width: 300px;
        font-size: 14px;
        font-family: 'Inter', sans-serif;
        background: #fff;
        color: #5a4a52;
        transition: all 0.3s;
    }

    input:focus {
        outline: none;
        border-color: #5a4a52;
        box-shadow: 0 0 8px rgba(90, 74, 82, 0.2);
    }

    input:hover {
        border-color: #5a4a52;
    }

    #controls {
        margin-bottom: 20px;
    }

    #controls h3 {
        margin-bottom: 8px;
        margin-top: 16px;
    }
#controls {
    margin-bottom: 20px;
}

#controls h3 {
    margin-bottom: 8px;
    margin-top: 16px;
}

#generateBtn {
    width: auto;
    padding: 10px 24px;
}

#viewer {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-top: 20px;
}
</style>
</head>

<body>

<h1>Chaos Game</h1>

<div id="controls">

    <h3>Players</h3>
    <input id="friendsInput"
           value="Keshia, Alicia, Carol, Alexis, Elena, Rachel, Olivia, Alyah">

    <h3>Immortal Players</h3>
    <input id="weirdInput"
           value="Arnnav Kudale, PK, GG, RM, Michael Li">

    <h3>Roleplay As (optional)</h3>
    <input id="roleplayInput" value="" placeholder="Type a player name for choose-your-own-adventure mode">

</div>

<button id="generateBtn" onclick="runGame()">Generate Story</button>

<div id="viewer">
    <button onclick="prevEvent()">←</button>
    <div id="eventText">Click "Generate Story"</div>
    <button onclick="nextEvent()">→</button>
</div>
<div id="choiceRow" style="display:none; gap:12px; margin-top: 16px;">
    <button id="choiceA" style="width:auto; padding:10px 18px;" onclick="pickChoice(0)">Choice A</button>
    <button id="choiceB" style="width:auto; padding:10px 18px;" onclick="pickChoice(1)">Choice B</button>
</div>

<script>
let events = [];
let currentIndex = 0;
let activePlayers = [];
let immortalPlayers = [];
let gameOver = false;
let pendingChoices = [];

function runGame() {
    events = [];
    currentIndex = 0;
    gameOver = false;
    pendingChoices = [];

    let friends = document.getElementById("friendsInput").value
        .split(",")
        .map(x => x.trim())
        .filter(x => x !== "");

    let weirdpeople = document.getElementById("weirdInput").value
         .split(",")
         .map(x => x.trim())
         .filter(x => x !== "");

    events.push("The players in this game are: " + friends.join(", "));
    events.push("Influencers (immortal): " + weirdpeople.join(", "));
    events.push("Choose your path below to decide what happens next.");
    activePlayers = [...friends];
    immortalPlayers = [...weirdpeople];

    showEvent();
    prepareChoices();
}

function randomFrom(list) {
    return list[Math.floor(Math.random() * list.length)];
}

function createOption() {
    const weirdactions = ['screams "Little Girl!" at', 'kills', 'screams "Little Boy" at', 'accidentally deletes', 'sponsors', 'scolds this person for having a low credit score: ', 'chases', 'says "I am not a minor anymore!" to'];
    const actions = ['loves', 'hates', 'hugs', 'eats', 'misses', 'cooks', 'marries', 'kisses', 'kills',
                   'interlocks toes with', 'inflates', 'defenestrates', 'cornobbles',
                   'drowns', 'touches', 'jumps', 'blows up', 'vaporizes', 'yeets', 'steal the left shoe of', 'steals the right shoe of', 'takes feet pics of', 'gives an apple to', 'sings Baby Shark at', 'scolds this person for having a low credit score: ', 'robs'];
    const lethal = ['kills','eats','drowns','blows up','inflates','defenestrates','vaporizes','accidentally deletes'];

    const roll = Math.floor(Math.random() * 4);
    const source = roll >= 3 ? randomFrom(immortalPlayers) : randomFrom(activePlayers);
    const action = roll >= 3 ? randomFrom(weirdactions) : randomFrom(actions);
    let target = randomFrom(activePlayers);
    while (target === source && activePlayers.length > 1) {
        target = randomFrom(activePlayers);
    }
    return { source, action, target, lethal: lethal.includes(action) };
}

function prepareChoices() {
    if (activePlayers.length <= 1) {
        gameOver = true;
        if (activePlayers.length === 1) events.push(activePlayers[0] + " is the winner!");
        currentIndex = events.length - 1;
        showEvent();
        document.getElementById("choiceRow").style.display = "none";
        return;
    }
    pendingChoices = [createOption(), createOption()];
    document.getElementById("choiceA").innerText = pendingChoices[0].source + " " + pendingChoices[0].action + " " + pendingChoices[0].target;
    document.getElementById("choiceB").innerText = pendingChoices[1].source + " " + pendingChoices[1].action + " " + pendingChoices[1].target;
    document.getElementById("choiceRow").style.display = "flex";
}

function pickChoice(choiceIndex) {
    if (gameOver) return;
    const pick = pendingChoices[choiceIndex];
    events.push(pick.source + " " + pick.action + " " + pick.target);
    if (pick.action === 'screams "Little Boy" at') {
        events.push(pick.target + " screams back 'What? I'm a girl?'");
    }
    if (pick.lethal && activePlayers.includes(pick.target)) {
        activePlayers.splice(activePlayers.indexOf(pick.target), 1);
        events.push(pick.target + " is now dead.");
        if (activePlayers.length === 2) {
            events.push("Final showdown between " + activePlayers[0] + " and " + activePlayers[1] + "!");
        }
    }
    currentIndex = events.length - 1;
    showEvent();
    prepareChoices();
}

function showEvent() {
    let el = document.getElementById("eventText");
    el.style.opacity = 0;

    setTimeout(() => {
        el.innerText = events[currentIndex];

        // color deaths red
        if (events[currentIndex].includes("dead")) {
            el.style.color = "#ff6b6b";
        } else {
            el.style.color = "#5a4a52";
        }

        el.style.opacity = 1;
    }, 150);
}

function nextEvent() {
    if (currentIndex < events.length - 1) {
        currentIndex++;
        showEvent();
    }
}

function prevEvent() {
    if (currentIndex > 0) {
        currentIndex--;
        showEvent();
    }
}

function showAllEvents() {
    let el = document.getElementById("eventText");

    el.innerHTML = events.join("<br><br>");
}
</script>

</body>
</html>
