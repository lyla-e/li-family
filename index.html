<!DOCTYPE html>
<html>
<head>
    <title>The Hunger Games: Li Family Edition!</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        background: #f7f2f5;
        color: #5a4a52;
        font-family: 'Playfair Display', serif;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
    }

    h1 {
        margin-bottom: 10px;
    }

button {
    font-size: 18px;
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background: #e6cfd8;
    color: #5a4a52;
    width: 50px;
    text-align: center;
}

    button:hover {
        background: #3a3a45;
        color: #f7f2f5;
    }

    #viewer {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-top: 40px;
    }

#eventText {
    font-size: 24px;
    max-width: 600px;
    width: 600px;
    height: 100px;

    display: flex;
    align-items: center;      /* vertical centering */
    justify-content: center;  /* horizontal centering */

    text-align: center;
    transition: opacity 0.3s;
}

    input {
        padding: 12px 16px;
        border-radius: 8px;
        border: 2px solid #e6cfd8;
        width: 300px;
        font-size: 14px;
        font-family: 'Inter', sans-serif;
        background: #fff;
        color: #5a4a52;
        transition: all 0.3s;
    }

    input:focus {
        outline: none;
        border-color: #5a4a52;
        box-shadow: 0 0 8px rgba(90, 74, 82, 0.2);
    }

    input:hover {
        border-color: #5a4a52;
    }

    #controls {
        margin-bottom: 20px;
    }

    #controls h3 {
        margin-bottom: 8px;
        margin-top: 16px;
    }
#controls {
    margin-bottom: 20px;
}

#controls h3 {
    margin-bottom: 8px;
    margin-top: 16px;
}

#generateBtn {
    width: auto;
    padding: 10px 24px;
}

#viewer {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-top: 20px;
}
</style>
</head>

<body>

<h1>Chaos Game</h1>

<div id="controls">

    <h3>Players</h3>
    <input id="friendsInput"
           value="Keshia, Alicia, Carol, Alexis, Elena, Rachel, Olivia, Alyah">

    <h3>Immortal Players</h3>
    <input id="weirdInput"
           value="Arnnav Kudale, PK, GG, RM, Michael Li">

    <h3>Roleplay As (optional)</h3>
    <input id="roleplayInput" value="" placeholder="Type a player name for choose-your-own-adventure mode">

</div>

<button id="generateBtn" onclick="runGame()">Generate Story</button>

<div id="viewer">
    <button onclick="prevEvent()">←</button>
    <div id="eventText">Click "Generate Story"</div>
    <button onclick="nextEvent()">→</button>
</div>
<div id="choiceRow" style="display:none; gap:12px; margin-top: 16px;">
    <button id="choiceA" style="width:auto; padding:10px 18px;" onclick="pickChoice(0)">Choice A</button>
    <button id="choiceB" style="width:auto; padding:10px 18px;" onclick="pickChoice(1)">Choice B</button>
</div>

<script>
let events = [];
let currentIndex = 0;
let activePlayers = [];
let immortalPlayers = [];
let gameOver = false;
let pendingChoices = [];
let roleplayPlayer = "";
let turnsUntilChoice = 0;

function runGame() {
    events = [];
    currentIndex = 0;
    gameOver = false;
    pendingChoices = [];
    turnsUntilChoice = 0;

    let friends = document.getElementById("friendsInput").value
        .split(",")
        .map(x => x.trim())
        .filter(x => x !== "");

    let weirdpeople = document.getElementById("weirdInput").value
         .split(",")
         .map(x => x.trim())
         .filter(x => x !== "");
    roleplayPlayer = document.getElementById("roleplayInput").value.trim();

    events.push("The players in this game are: " + friends.join(", "));
    events.push("Influencers (immortal): " + weirdpeople.join(", "));
    activePlayers = [...friends];
    immortalPlayers = [...weirdpeople];

    if (roleplayPlayer !== "") {
        events.push("Roleplay mode enabled: You are " + roleplayPlayer + ".");
        events.push("Your choices appear every few events and can change the story.");
        turnsUntilChoice = randomTurnsToChoice();
    } else {
        events.push("No roleplay name entered, so this round is fully random.");
    }

    showEvent();
    if (roleplayPlayer !== "") {
        prepareChoices();
    } else {
        runAutomaticRound();
    }
}

function randomFrom(list) {
    return list[Math.floor(Math.random() * list.length)];
}

function createOption() {
    const weirdactions = ['screams "Little Girl!" at', 'kills', 'screams "Little Boy" at', 'accidentally deletes', 'sponsors', 'scolds this person for having a low credit score: ', 'chases', 'says "I am not a minor anymore!" to'];
    const actions = ['loves', 'hates', 'hugs', 'eats', 'misses', 'cooks', 'marries', 'kisses', 'kills',
                   'interlocks toes with', 'inflates', 'defenestrates', 'cornobbles',
                   'drowns', 'touches', 'jumps', 'blows up', 'vaporizes', 'yeets', 'steal the left shoe of', 'steals the right shoe of', 'takes feet pics of', 'gives an apple to', 'sings Baby Shark at', 'scolds this person for having a low credit score: ', 'robs'];
    const lethal = ['kills','eats','drowns','blows up','inflates','defenestrates','vaporizes','accidentally deletes'];

    const roll = Math.floor(Math.random() * 4);
    const source = roll >= 3 ? randomFrom(immortalPlayers) : randomFrom(activePlayers);
    const action = roll >= 3 ? randomFrom(weirdactions) : randomFrom(actions);
    let target = randomFrom(activePlayers);
    while (target === source && activePlayers.length > 1) {
        target = randomFrom(activePlayers);
    }
    return { source, action, target, lethal: lethal.includes(action) };
}

function randomTurnsToChoice() {
    return Math.floor(Math.random() * 4) + 2;
}

function createRoleplayChoices() {
    const aliveTargets = activePlayers.filter(x => x !== roleplayPlayer);
    if (aliveTargets.length === 0) {
        return [
            { type: "train", source: roleplayPlayer, text: roleplayPlayer + " goes on a speed-training run." },
            { type: "hide", source: roleplayPlayer, text: roleplayPlayer + " hides quietly to avoid drama." }
        ];
    }
    const targetA = randomFrom(aliveTargets);
    const targetB = randomFrom(aliveTargets);
    const targetC = randomFrom(aliveTargets);
    const actionPool = [
        { type: "poison", source: roleplayPlayer, target: targetA, text: roleplayPlayer + " poisons " + targetA + "'s drink." },
        { type: "frame", source: roleplayPlayer, target: targetB, text: roleplayPlayer + " plants fake evidence against " + targetB + "." },
        { type: "train", source: roleplayPlayer, target: targetC, text: roleplayPlayer + " goes on a speed-training run." },
        { type: "alliance", source: roleplayPlayer, target: targetC, text: roleplayPlayer + " tries to form a secret alliance with " + targetC + "." }
    ];
    const first = randomFrom(actionPool);
    let second = randomFrom(actionPool);
    while (second.text === first.text) second = randomFrom(actionPool);
    return [
        first,
        second
    ];
}

function resolveRoleplayChoice(choice) {
    events.push(choice.text);
    if (choice.type === "poison") {
        if (Math.random() < 0.45) {
            events.push(choice.target + " discovers the poison and launches an investigation.");
            const suspect = randomFrom(activePlayers);
            events.push("The questioning gets messy and everyone starts blaming " + suspect + ".");
            if (Math.random() < 0.35 && activePlayers.includes(roleplayPlayer)) {
                events.push(roleplayPlayer + " says something shady during the interview.");
                activePlayers.splice(activePlayers.indexOf(roleplayPlayer), 1);
                events.push("The crowd panics and eliminates " + roleplayPlayer + ".");
            } else {
                events.push("No one can prove anything... yet.");
            }
        } else if (activePlayers.includes(choice.target)) {
            activePlayers.splice(activePlayers.indexOf(choice.target), 1);
            events.push(choice.target + " drinks it and is now dead.");
        }
    } else if (choice.type === "frame") {
        if (Math.random() < 0.5) {
            events.push("People believe the evidence and turn against " + choice.target + ".");
            if (activePlayers.includes(choice.target)) {
                activePlayers.splice(activePlayers.indexOf(choice.target), 1);
                events.push(choice.target + " is now dead.");
            }
        } else {
            events.push("The setup backfires and suspicion swings toward " + roleplayPlayer + ".");
            if (Math.random() < 0.4 && activePlayers.includes(roleplayPlayer)) {
                activePlayers.splice(activePlayers.indexOf(roleplayPlayer), 1);
                events.push(roleplayPlayer + " is now dead.");
            }
        }
    } else if (choice.type === "train") {
        events.push(roleplayPlayer + " feels faster after training.");
        if (Math.random() < 0.7) {
            const possibleComplimenters = activePlayers.filter(x => x !== roleplayPlayer);
            if (possibleComplimenters.length > 0) {
                const complimenter = randomFrom(possibleComplimenters);
                events.push(complimenter + " compliments " + roleplayPlayer + ": 'Wow, you're so fast now!'");
            }
        }
        if (Math.random() < 0.2) {
            events.push(roleplayPlayer + " trips during a sprint and gets minorly injured.");
        }
    } else if (choice.type === "alliance") {
        if (Math.random() < 0.55) {
            events.push(choice.target + " agrees to the alliance and promises backup.");
        } else {
            events.push(choice.target + " rejects the alliance and leaks the plan.");
            if (Math.random() < 0.25 && activePlayers.includes(roleplayPlayer)) {
                activePlayers.splice(activePlayers.indexOf(roleplayPlayer), 1);
                events.push(roleplayPlayer + " gets targeted for scheming and is now dead.");
            }
        }
    } else if (choice.type === "hide") {
        events.push(roleplayPlayer + " avoids conflict and survives this round unnoticed.");
    }
}

function prepareChoices() {
    if (activePlayers.length <= 1) {
        gameOver = true;
        if (activePlayers.length === 1) events.push(activePlayers[0] + " is the winner!");
        currentIndex = events.length - 1;
        showEvent();
        document.getElementById("choiceRow").style.display = "none";
        return;
    }
    if (!activePlayers.includes(roleplayPlayer)) {
        events.push(roleplayPlayer + " is out, so the rest of the story continues randomly.");
        showEvent();
        document.getElementById("choiceRow").style.display = "none";
        runAutomaticRound();
        return;
    }
    pendingChoices = createRoleplayChoices();
    document.getElementById("choiceA").innerText = pendingChoices[0].text;
    document.getElementById("choiceB").innerText = pendingChoices[1].text;
    document.getElementById("choiceRow").style.display = "flex";
}

function pickChoice(choiceIndex) {
    if (gameOver) return;
    const pick = pendingChoices[choiceIndex];
    resolveRoleplayChoice(pick);
    currentIndex = events.length - 1;
    showEvent();
    if (activePlayers.length === 2) {
        events.push("Final showdown between " + activePlayers[0] + " and " + activePlayers[1] + "!");
    }
    document.getElementById("choiceRow").style.display = "none";
    turnsUntilChoice = randomTurnsToChoice();
    runAutomaticRound();
}

function applyGenericOption(pick) {
    events.push(pick.source + " " + pick.action + " " + pick.target);
    if (pick.action === 'screams "Little Boy" at') events.push(pick.target + " screams back 'What? I'm a girl?'");
    if (pick.lethal && activePlayers.includes(pick.target)) {
        activePlayers.splice(activePlayers.indexOf(pick.target), 1);
        events.push(pick.target + " is now dead.");
        if (activePlayers.length === 2) events.push("Final showdown between " + activePlayers[0] + " and " + activePlayers[1] + "!");
    }
}

function runAutomaticRound() {
    while (activePlayers.length > 1) {
        if (roleplayPlayer !== "" && activePlayers.includes(roleplayPlayer) && turnsUntilChoice <= 0) {
            currentIndex = events.length - 1;
            showEvent();
            prepareChoices();
            return;
        }
        applyGenericOption(createOption());
        if (roleplayPlayer !== "" && activePlayers.includes(roleplayPlayer)) turnsUntilChoice--;
    }
    gameOver = true;
    if (activePlayers.length === 1) events.push(activePlayers[0] + " is the winner!");
    currentIndex = events.length - 1;
    showEvent();
}

function showEvent() {
    let el = document.getElementById("eventText");
    el.style.opacity = 0;

    setTimeout(() => {
        el.innerText = events[currentIndex];

        // color deaths red
        if (events[currentIndex].includes("dead")) {
            el.style.color = "#ff6b6b";
        } else {
            el.style.color = "#5a4a52";
        }

        el.style.opacity = 1;
    }, 150);
}

function nextEvent() {
    if (currentIndex < events.length - 1) {
        currentIndex++;
        showEvent();
    }
}

function prevEvent() {
    if (currentIndex > 0) {
        currentIndex--;
        showEvent();
    }
}

function showAllEvents() {
    let el = document.getElementById("eventText");

    el.innerHTML = events.join("<br><br>");
}
</script>

</body>
</html>
