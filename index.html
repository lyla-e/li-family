<!DOCTYPE html>
<html>
<head>
    <title>The Hunger Games: Li Family Edition!</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        background: #f7f2f5;
        color: #5a4a52;
        font-family: 'Playfair Display', serif;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
    }

    h1 {
        margin-bottom: 10px;
    }

button {
    font-size: 18px;
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background: #e6cfd8;
    color: #5a4a52;
    width: 50px;
    text-align: center;
}

    button:hover {
        background: #3a3a45;
        color: #f7f2f5;
    }

    #viewer {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-top: 40px;
    }

#eventText {
    font-size: 24px;
    max-width: 600px;
    width: 600px;
    height: 100px;

    display: flex;
    align-items: center;      /* vertical centering */
    justify-content: center;  /* horizontal centering */

    text-align: center;
    transition: opacity 0.3s;
}

    input {
        padding: 12px 16px;
        border-radius: 8px;
        border: 2px solid #e6cfd8;
        width: 300px;
        font-size: 14px;
        font-family: 'Inter', sans-serif;
        background: #fff;
        color: #5a4a52;
        transition: all 0.3s;
    }

    input:focus {
        outline: none;
        border-color: #5a4a52;
        box-shadow: 0 0 8px rgba(90, 74, 82, 0.2);
    }

    input:hover {
        border-color: #5a4a52;
    }

    #controls {
        margin-bottom: 20px;
    }

    #controls h3 {
        margin-bottom: 8px;
        margin-top: 16px;
    }
#controls {
    margin-bottom: 20px;
}

#controls h3 {
    margin-bottom: 8px;
    margin-top: 16px;
}

#generateBtn {
    width: auto;
    padding: 10px 24px;
}

#viewer {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-top: 20px;
}
</style>
</head>

<body>

<h1>Chaos Game</h1>

<div id="controls">

    <h3>Players</h3>
    <input id="friendsInput"
           value="Keshia, Alicia, Carol, Alexis, Elena, Rachel, Olivia, Alyah">

    <h3>Immortal Players</h3>
    <input id="weirdInput"
           value="Arnnav Kudale, PK, GG, RM, Michael Li">

</div>

<button id="generateBtn" onclick="runGame()">Generate Story</button>

<div id="viewer">
    <button onclick="prevEvent()">←</button>
    <div id="eventText">Click "Generate Story"</div>
    <button onclick="nextEvent()">→</button>
</div>

<script>
let events = [];
let currentIndex = 0;

function runGame() {
    events = [];
    currentIndex = 0;

    let friends = document.getElementById("friendsInput").value
        .split(",")
        .map(x => x.trim())
        .filter(x => x !== "");

    let weirdpeople = document.getElementById("weirdInput").value
         .split(",")
         .map(x => x.trim())
         .filter(x => x !== "");

    let weirdactions = ['screams "Little Girl!" at', 'kills', 'screams "Little Boy" at', 'accidentally deletes', 'sponsors', 'scolds this person for having a low credit score: ', 'chases', 'says "I am not a minor anymore!" to'];
    let actions = ['loves', 'hates', 'hugs', 'eats', 'misses', 'cooks', 'marries', 'kisses', 'kills', 
                   'interlocks toes with', 'inflates', 'defenestrates', 'cornobbles',
                   'drowns', 'touches', 'jumps', 'blows up', 'vaporizes', 'yeets', 'steal the left shoe of', 'steals the right shoe of', 'takes feet pics of', 'gives an apple to', 'sings Baby Shark at', 'scolds this person for having a low credit score: ', 'robs'];

    let deaths = 0;

    events.push("The players in this game are: " + friends.join(", "));
    events.push("Influencers (immortal): " + weirdpeople.join(", "));

    while (friends.length > 1) {
        let roll = Math.floor(Math.random() * 4);

        let friend, action;

        if (roll >= 3) {
            friend = weirdpeople[Math.floor(Math.random() * weirdpeople.length)];
            action = weirdactions[Math.floor(Math.random() * weirdactions.length)];
        } else {
            friend = friends[Math.floor(Math.random() * friends.length)];
            action = actions[Math.floor(Math.random() * actions.length)];
        }

        let friend2 = friends[Math.floor(Math.random() * friends.length)];

        // prevent self-targeting
        while (friend2 === friend && friends.length > 1) {
            friend2 = friends[Math.floor(Math.random() * friends.length)];
        }

        events.push(friend + " " + action + " " + friend2);

        if (action === 'screams "Little Boy" at') {
            events.push(friend2 + " screams back 'What? I'm a girl?'");
        }

        if (['kills','eats','drowns','blows up','inflates','defenestrates', 'blows up', 'vaporizes', 'accidentally deletes'].includes(action)) {
            friends.splice(friends.indexOf(friend2), 1);
            events.push(friend2 + " is now dead.");

            deaths++;

            if (deaths === 1) {
                events.push("This is the first death!");
            }

            if (friends.length === 2) {
                events.push("Final showdown between " + friends[0] + " and " + friends[1] + "!");
            }
        }
    }

    if (friends.length === 1) {
        events.push(friends[0] + " is the winner!");
    }

    showEvent();
    setTimeout(() => {
        showAllEvents();
    }, 500 + (events.length * 300));
}

function showEvent() {
    let el = document.getElementById("eventText");
    el.style.opacity = 0;

    setTimeout(() => {
        el.innerText = events[currentIndex];

        // color deaths red
        if (events[currentIndex].includes("dead")) {
            el.style.color = "#ff6b6b";
        } else {
            el.style.color = "#5a4a52";
        }

        el.style.opacity = 1;
    }, 150);
}

function nextEvent() {
    if (currentIndex < events.length - 1) {
        currentIndex++;
        showEvent();
    }
}

function prevEvent() {
    if (currentIndex > 0) {
        currentIndex--;
        showEvent();
    }
}

function showAllEvents() {
    let el = document.getElementById("eventText");

    el.innerHTML = events.join("<br><br>");
}
</script>

</body>
</html>
